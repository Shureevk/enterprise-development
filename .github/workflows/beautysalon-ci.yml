name: BeautySalon CI

on:
  push:
    branches:
      - lab2
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BeautySalon.slnx

      - name: Build solution
        run: dotnet build BeautySalon.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build